[package]
name = "git-ark"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A write-only backup vault that fronts your own git host"
repository = "https://github.com/boomctl/git-ark"
homepage = "https://github.com/boomctl/git-ark"
readme = "README.md"
keywords = ["backup", "git", "encryption", "s3", "ssh"]
categories = ["command-line-utilities"]

# cargo-binstall: fetch the prebuilt release binary instead of compiling.
# `cargo binstall git-ark`
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/git-ark-{ target }{ binary-ext }"
bin-dir = "git-ark-{ target }{ binary-ext }"
pkg-fmt = "bin"

[lib]
name = "git_ark"
path = "src/lib.rs"

[[bin]]
name = "git-ark"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
age = "0.10"
rusty-s3 = "0.5"
ureq = "2"
md5 = "0.7"
shell-words = "1"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
