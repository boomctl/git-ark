name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runners ship a stable Rust toolchain; just add the components we gate on.
      - name: Add rustfmt + clippy
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      # --locked: the committed Cargo.lock must resolve as-is, no silent updates.
      # The MinIO-backed integration test is #[ignore]d and stays out of CI.
      - name: Test
        run: cargo test --all --locked
